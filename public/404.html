<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirection...</title>
    <script>
      (function redirectToSpa() {
        var locationPath = window.location.pathname + window.location.search + window.location.hash;
        var encodedPath = encodeURIComponent(locationPath);
        var newUrl = window.location.protocol + '//' + window.location.host + '/reco/?/' + encodedPath;
        window.location.replace(newUrl);
      })();
    </script>
  </head>
  <body>
    <noscript>
      <p>Veuillez activer JavaScript pour être redirigé vers l'application.</p>
    </noscript>
  </body>
</html>
